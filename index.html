<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jule Næse-spil</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sne"></div>
    <main class="spil-container">
      <h1>Jule Næse-spil</h1>
      <p id="tur-tekst" class="tur-tekst">Tur: Grøn næse</p>
      <section class="braet" aria-label="Spillebræt">
        <button class="felt" data-index="0" aria-label="Felt 1"></button>
        <button class="felt" data-index="1" aria-label="Felt 2"></button>
        <button class="felt" data-index="2" aria-label="Felt 3"></button>
        <button class="felt" data-index="3" aria-label="Felt 4"></button>
        <button class="felt" data-index="4" aria-label="Felt 5"></button>
        <button class="felt" data-index="5" aria-label="Felt 6"></button>
        <button class="felt" data-index="6" aria-label="Felt 7"></button>
        <button class="felt" data-index="7" aria-label="Felt 8"></button>
        <button class="felt" data-index="8" aria-label="Felt 9"></button>
      </section>
      <p id="resultat" class="resultat" aria-live="polite">&nbsp;</p>
      <button id="reset-knap" class="reset-knap">Start forfra</button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
